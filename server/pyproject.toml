[project]
name = "substance-designer-mcp"
version = "2.5.0"
description = "MCP bridge server for Substance Designer"
requires-python = ">=3.12"
dependencies = [
    # Tested on 1.26.0; structured output (typed tool results) and Context
    # progress reporting need recent 1.x. Keep <2 since major releases may
    # change the FastMCP API this bridge relies on.
    "mcp[cli]>=1.26.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
markers = [
    "live: needs a running Substance Designer with the MCP plugin on localhost:9881 (skipped when the port is closed)",
]
